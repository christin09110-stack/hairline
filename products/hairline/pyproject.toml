[project]
name = "hairline"
version = "0.1.0"
description = "Crack width metrology from phone video, with a marker for scale"
requires-python = ">=3.12"
dependencies = [
    # PINNED HARD. Unpinned `opencv-python` resolves to 4.14.x, which shipped
    # after 5.0.0 and would fail the competition's core requirement.
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.3",
    "visioncore",
    "servicekit",
]

[project.scripts]
hairline = "hairline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hairline"]

[tool.hatch.metadata]
allow-direct-references = true
