name: hairline

# The calibration gate runs here, and it gates publishing.
#
# `docs/design/hairline-spec.md` §9: "The calibration test against printed lines of
# known width must run in CI, and its result must gate publishing." So the image build
# and the deploy step both depend on the test job, and the test job fails if a line of
# known printed width comes back with the wrong width on it.
#
# research/FINDINGS.md §5.0 is why: a previous implementation of this measurement
# reported 283 mm for a 0.75 mm crack and nothing raised. A build that cannot measure
# a line it drew itself must not reach a structure.

on:
  push:
    branches: [master, main]
    paths: ['products/hairline/**', 'packages/**', '.github/workflows/hairline.yml']
  pull_request:
    paths: ['products/hairline/**', 'packages/**']
  workflow_dispatch:

concurrency:
  group: hairline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    name: calibration gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install, pinned
        run: |
          python -m pip install --upgrade pip
          # OpenCV is pinned in visioncore's pyproject.toml and constrained here.
          # Unpinned, pip resolves to 4.14.x, which shipped after 5.0.0 and would
          # fail the competition's core requirement silently.
          pip install --constraint constraints.txt \
            ./packages/visioncore ./packages/servicekit ./products/hairline
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 httpx==0.28.1 ruff==0.16.7

      - name: OpenCV 5, or stop here
        run: |
          python - <<'PY'
          import sys

          import cv2
          print("OpenCV", cv2.__version__)
          if not cv2.__version__.startswith("5."):
              sys.exit(f"got OpenCV {cv2.__version__}, this entry requires 5.x")
          PY

      - name: The calibration gate
        id: gate
        run: |
          cd products/hairline
          python -m pytest tests/test_calibration_gate.py -q --tb=short

      - name: Publish the gate's own numbers
        if: always()
        run: |
          cd products/hairline
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from hairline.calibration_gate import check

          report = check()
          print("## Calibration gate\n")
          print(f"**{report.summary()}**\n")
          print("| Printed | Measured | Error | Resolved | Verdict |")
          print("|---|---:|---:|---:|---|")
          for line in report.lines:
              measured = "declined" if line.measured_mm is None else f"{line.measured_mm:.3f} mm"
              error = "" if line.error_pct is None else f"{line.error_pct:+.2f}%"
              resolved = "" if line.resolved_px is None else f"{line.resolved_px:.1f} px"
              verdict = "pass" if line.ok else "**FAIL**"
              print(f"| {line.printed_mm:.3f} mm | {measured} | {error} | {resolved} | {verdict} |")
          print(f"\nScale error {report.scale_error_pct:+.3f}%, "
                f"blur sigma {report.sigma_px:.2f} px, "
                f"tolerance {report.tolerance_pct:.0f}%.")
          PY

      - name: Everything else
        run: |
          cd products/hairline
          python -m pytest tests -q --tb=short

      - name: Lint
        run: ruff check products/hairline --no-cache

  publish:
    name: build and push the image
    needs: calibration          # <- the gate. No calibration, no image.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: products/hairline/Dockerfile
          platforms: linux/arm64
          push: false          # pushing needs credentials this repository does not hold
          build-args: GIT_SHA=${{ github.sha }}
          tags: hairline:${{ github.sha }}
